<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="plugin.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <title>Document</title>
</head>
<body>
<div id="tracking-system">
  <div class="innder-tracking-title">
    <h2>How are You feeling</h2>
  </div>

  <div class="inner-tracking-main">
    <div class="child-tracking">
      <i class="fa-solid fa-heart-pulse"></i>
      <h5>Heart Rate</h5>
      <p><span class="counter" data-target="75">0</span> bpm</p>
    </div>
    <div class="child-tracking">
      <i class="fa-solid fa-moon"></i>
      <h5>Sleep</h5>
      <p> <span class="counter" data-target="8"> 0</span> hours</p>
    </div>
    <div class="child-tracking">
      <i class="fa-solid fa-cocktail"></i>
      <h5>Water</h5>
      <p><span class="counter" data-target="10">0</span> glass</p>
    </div>
    <div class="child-tracking">
      <i class="fa-solid fa-walking"></i>
      <h5>Steps</h5>
      <p> <span class="counter" data-target="11000">0</span></p>
    </div>
  </div>
</div>



  <script src="index.js"></script>
</body>
</html>
